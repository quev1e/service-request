{% extends "base.html" %}

{% block title %}Удаление комментария{% endblock %}

{% block content %}
    <div class="card form-card">
        <h1 class="page-title" style="font-size: 24px;">
            Удалить комментарий?
        </h1>

        <p class="page-subtitle">
            Это действие нельзя отменить.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-actions">
                <button class="btn btn-danger"
                        type="submit">
                    Да, удалить
                </button>

                <a class="btn btn-outline"
                href="{% url 'requests:detail' request_obj.pk %}">
                    Отмена
                </a>
            </div>
        </form>
    </div>
{% endblock %}

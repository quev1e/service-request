{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
    <h1>Вход</h1>

    {% if form.errors %}
        <div class="error">
            Неверное имя пользователя или пароль.
        </div>
    {% endif %}

    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Войти</button>
        </form>
    </div>
{% endblock %}
